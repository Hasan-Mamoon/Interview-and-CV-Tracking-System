name: CI / CD Pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container 
      
      - name: Build and push server-epic1 image
        uses: docker/build-push-action@v3
        with:
          context: ./server-epic1
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/server-epic1:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/server-epic1:cache
          cache-to: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/server-epic1,mode=max
      
      - name: Build and push server-epic2 image
        uses: docker/build-push-action@v3
        with:
          context: ./server-epic2
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/server-epic2:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/server-epic2:cache
          cache-to: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/server-epic2,mode=max
      
      - name: Build and push client image
        uses: docker/build-push-action@v3
        with:
          context: ./client
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/client:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/client:cache
          cache-to: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/client,mode=max
      